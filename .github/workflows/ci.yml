name: CI / Build & Push Container

on:
  push:
    branches: [ "main", "develop" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Verify Audit Log Coverage
        run: npm run check:audit

      - name: Check Production Dependencies for High/Critical Advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Run Next.js Build
        run: npm run build

  publish-container:
    needs: test-and-verify
    # Only publish containers on actual branch pushes / merges (not for open pull requests)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Docker Tags (Test vs. Prod)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # PROD: Push / Merge to 'main' -> :latest
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # PROD: Git release tags -> :v0.0.1
            type=semver,pattern={{version}}
            # TEST: Push / Merge to 'develop' -> :test
            type=raw,value=test,enable=${{ github.ref == 'refs/heads/develop' }}
            # Git commit hash for exact GitOps tracking
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Checkout GitOps Repo
        if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          repository: diniskawolfiii/wtf-manage-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
          fetch-depth: 1

      - name: Update Image Tag in GitOps Repo
        if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
        env:
          SHORT_SHA: ${{ github.sha }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ENV_NAME="prod"
          else
            ENV_NAME="test"
          fi
          KUSTOMIZE_FILE="environments/${ENV_NAME}/kustomization.yaml"
          TAG="sha-${SHORT_SHA:0:7}"
          cd gitops
          if [ ! -f "${KUSTOMIZE_FILE}" ]; then
            echo "::error::Missing ${KUSTOMIZE_FILE} in wtf-manage-gitops."
            exit 1
          fi
          sed -i "/ghcr\.io\/diniskawolfiii\/wtf-manage/{n;s|newTag: .*|newTag: ${TAG}|;}" "${KUSTOMIZE_FILE}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet "${KUSTOMIZE_FILE}"; then
            git commit -am "chore(${ENV_NAME}): bump wtf-manage to ${TAG}"
            git push
          else
            echo "${ENV_NAME} image tag already up to date (${TAG})."
          fi
