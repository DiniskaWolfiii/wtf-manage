name: CI / Build & Push Container

on:
  push:
    branches: [ "main", "develop" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Next.js Build
        run: npm run build

  publish-container:
    needs: test-and-verify
    # Only publish containers on actual branch pushes / merges (not for open pull requests)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Docker Tags (Test vs. Prod)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # PROD: Push / Merge to 'main' -> :latest
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # PROD: Git release tags -> :v0.0.1
            type=semver,pattern={{version}}
            # TEST: Push / Merge to 'develop' -> :test
            type=raw,value=test,enable=${{ github.ref == 'refs/heads/develop' }}
            # Git commit hash for exact GitOps tracking
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Test Image Tag in GitOps Repo
        if: github.ref == 'refs/heads/develop'
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$GITOPS_TOKEN" ]; then
            echo "::error::Secret GITOPS_TOKEN is not set. Add a PAT/Deploy token with write access to diniskawolfiii/wtf-manage-gitops."
            exit 1
          fi
          TAG="sha-${SHORT_SHA:0:7}"
          git clone --depth 1 "https://x-access-token:${GITOPS_TOKEN}@github.com/diniskawolfiii/wtf-manage-gitops.git" gitops
          cd gitops
          sed -i "/ghcr\.io\/diniskawolfiii\/wtf-manage/{n;s|newTag: .*|newTag: ${TAG}|;}" environments/test/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet environments/test/kustomization.yaml; then
            git commit -am "chore(test): bump wtf-manage to ${TAG}"
            git push
          else
            echo "Test image tag already up to date (${TAG})."
          fi
