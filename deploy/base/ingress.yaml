apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wtf-manage
spec:
  ingressClassName: traefik
  rules:
    - host: manage.winterfur.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wtf-manage
                port:
                  number: 80
