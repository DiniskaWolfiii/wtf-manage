apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: winterfur-prod

resources:
  - ../../base

configMapGenerator:
  - name: wtf-manage-config
    literals:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=https://manage.winterfur.org
      - KEYCLOAK_ISSUER=https://identity.winterfur.org/realms/winterfur
      - KEYCLOAK_CLIENT_ID=wtf-manage

images:
  - name: ghcr.io/diniskawolfiii/wtf-manage
    newTag: latest

