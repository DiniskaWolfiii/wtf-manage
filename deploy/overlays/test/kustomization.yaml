apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: winterfur-test

resources:
  - ../../base

namePrefix: test-

configMapGenerator:
  - name: wtf-manage-config
    literals:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=https://manage-test.winterfur.org
      - KEYCLOAK_ISSUER=https://identity.winterfur.org/realms/winterfur-test
      - KEYCLOAK_CLIENT_ID=wtf-manage-test

patches:
  - target:
      kind: Ingress
      name: wtf-manage
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: manage-test.winterfur.org
      - op: replace
        path: /spec/tls/0/hosts/0
        value: manage-test.winterfur.org
      - op: replace
        path: /spec/tls/0/secretName
        value: wtf-manage-test-tls

